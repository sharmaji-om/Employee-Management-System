# This file serves the built frontend and forwards API requests in Docker.
# The frontend Docker image loads these settings automatically.
# Use the Docker Compose command from the root README.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  add_header Cache-Control "no-store";
  client_max_body_size 1m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; connect-src 'self'; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }
  location ~ ^/(docs|swagger-ui|v3/api-docs) {
    proxy_pass http://backend:8080;
    proxy_set_header Host $http_host;
  }
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
